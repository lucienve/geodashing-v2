<div class="template-view" id="view-leaderboard">
    <a href="#home" class="close-btn" aria-label="Close View">&times;</a>
    <h2>GLOBAL RANKINGS</h2>
    <div class="dash-block dash-hero">
        <h3 class="dash-hero-title-sm">
            TOP GEODASHERS
        </h3>
        <div class="leaderboard-stepper-row">
            <button type="button" id="btn-leaderboard-prev" class="btn btn-secondary btn-sm leaderboard-step-btn" aria-label="Previous Game" title="Previous Game">◀</button>
            <p id="leaderboard-cycle-title" class="dash-hero-subtitle-caps">
                CURRENT GAME CYCLE
            </p>
            <button type="button" id="btn-leaderboard-next" class="btn btn-secondary btn-sm leaderboard-step-btn" aria-label="Next Game" title="Next Game">▶</button>
        </div>
    </div>

    <!-- Active Game Shortcut (when viewing historical or preview game) -->
    <div id="leaderboard-active-shortcut" class="leaderboard-active-shortcut d-none">
        <button type="button" id="btn-leaderboard-active" class="btn btn-outline btn-sm btn-leaderboard-active">
            ↩ Return to Active Game
        </button>
    </div>

    <!-- Preview Notice for Upcoming Game -->
    <div id="leaderboard-preview-notice" class="leaderboard-preview-notice d-none">
        <span class="preview-notice-icon">⏳</span>
        <div class="preview-notice-content">
            <strong class="preview-notice-title">Game Preview Mode</strong>
            <p id="leaderboard-preview-desc" class="preview-notice-desc">
                This game has not started yet. Rankings will appear once the game begins.
            </p>
        </div>
    </div>

    <!-- Game Summary View Trigger -->
    <div id="leaderboard-summary-container" class="summary-container d-none">
        <button id="btn-view-summary" class="btn btn-outline btn-summary">
            📖 READ GAME SUMMARY
        </button>
    </div>

    <!-- Leaderboard Table -->
    <div class="dash-block table-dash-block">
        <table class="data-table data-table-full">
            <thead>
                <tr class="table-header-row">
                    <th class="th-rank">#</th>
                    <th class="th-user">GEODASHER</th>
                    <th class="th-points">PT</th>
                    <th class="th-logs">LOGS</th>
                </tr>
            </thead>
            <!-- Rows injected by javascript -->
            <tbody id="leaderboard-tbody">
                <tr>
                    <td colspan="4" class="td-loading">
                        Loading leaderboard...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Bottom padding -->
    <div class="content-spacer"></div>
</div>
