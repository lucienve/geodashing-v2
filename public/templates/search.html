<div class="template-view" id="view-search">
    <a href="#home" class="close-btn" aria-label="Close View">&times;</a>
    <h2>DASHPOINT EXPORT</h2>

    <div id="search-feedback"></div>

    <p class="export-description">
        Enter the bounding box parameters to force a specific map view, or download dashpoint data from the region
        directly to your handheld GPS device.
    </p>

    <button type="button" class="btn btn-secondary btn-grab-bounds" id="btn-grab-bounds">
        [ Export visible area ]
    </button>

    <div class="export-grid">
        <div>
            <label class="export-label">NORTH LIMIT</label>
            <input type="number" step="any" id="search-n" class="data-input export-input" placeholder="42.500">
        </div>
        <div>
            <label class="export-label">SOUTH LIMIT</label>
            <input type="number" step="any" id="search-s" class="data-input export-input" placeholder="41.500">
        </div>
        <div>
            <label class="export-label">EAST LIMIT</label>
            <input type="number" step="any" id="search-e" class="data-input export-input" placeholder="-70.000">
        </div>
        <div>
            <label class="export-label">WEST LIMIT</label>
            <input type="number" step="any" id="search-w" class="data-input export-input" placeholder="-72.000">
        </div>
    </div>

    <button type="button" class="btn btn-secondary export-btn-snap" id="btn-teleport">
        [ SNAP MAP TO BOUNDS ]
    </button>

    <div class="dash-block export-block">
        <h3 class="export-heading">EXPORT FILE TYPES</h3>

        <div class="export-btn-group">
            <button type="button" class="btn btn-primary" id="btn-export-gpx">
                DOWNLINK .GPX
            </button>
            <button type="button" class="btn btn-primary btn-loc" id="btn-export-loc">
                DOWNLINK .LOC
            </button>
        </div>
        <small class="export-disclaimer">
            *Downloads map data enclosed by the boundaries above.
        </small>
    </div>
</div>
