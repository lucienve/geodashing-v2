<div class="template-view" id="view-edit">
    <a href="#home" class="close-btn" aria-label="Close View">&times;</a>
    <h2>EDIT LOG</h2>

    <div class="dash-hero">
        <h3 class="dash-hero-title-sm">
            DASHPOINT LOGGED
        </h3>
        <p class="dash-hero-subtitle" id="edit-dp-coord-label">
            EDITING DASHPOINT LOG
        </p>
    </div>

    <form id="form-edit" enctype="multipart/form-data">
        <input type="hidden" id="edit_dashpoint_id" name="dashpoint_id">
        <input type="hidden" id="edit_kept_photos" name="kept_photos" value="[]">

        <div class="dash-block edit-block">
            <label for="edit-notes">NOTES (Max 10k chars)</label>
            <textarea id="edit-notes" name="notes" class="data-input textarea-resizable" rows="5" placeholder="Enter visit notes..."
                required></textarea>
        </div>

        <div class="dash-block edit-block">
            <label for="edit_send_email"><input type="checkbox" id="edit_send_email" name="send_email" value="1" checked class="checkbox-inline"> EMAIL UPDATED LOG</label>
        </div>

        <div class="dash-block edit-block">
            <span class="edit-section-label">PHOTOS</span>
            <div id="edit-existing-photos" class="edit-photos-grid">
                <p class="edit-photos-empty">
                    [ NO PHOTOS ]</p>
            </div>
            <p class="edit-photos-tip">Click [X] to remove photo, or tap to edit/add caption.</p>
        </div>

        <div class="dash-block edit-block">
            <label for="edit-photos">ATTACH NEW PHOTOS (Max 10 total)</label>
            <input type="file" id="edit-photos" name="photos[]" multiple accept="image/*" class="file-input-hidden">
            <button type="button" class="btn btn-secondary btn-add-photos" id="btn-add-edit-photos">
                ADD NEW PHOTOS
            </button>
            <small class="photo-caption-tip">
                Tip: Tap any attached new photo thumbnail to add a custom caption.
            </small>
            <div id="edit-new-photo-preview-grid" class="photo-preview-grid">
            </div>
        </div>

        <div id="edit-status" class="status-message"></div>

        <button type="submit" class="btn btn-primary btn-full-width" id="btn-submit-edit">SAVE EDITS</button>
    </form>
</div>
