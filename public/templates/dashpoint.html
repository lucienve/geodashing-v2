<div class="template-view" id="view-dashpoint">
    <a href="#home" class="close-btn" aria-label="Close View">&times;</a>
    <h2>DASHPOINT</h2>

    <div class="dash-block" style="text-align:center; padding: 1.5rem; margin-bottom:1.5rem;">
        <h3 id="dp-id-label"
            style="color:var(--accent-green); font-size:1.8rem; margin-bottom:0.5rem; letter-spacing:2px;">
            [ LOADING ]
        </h3>
        <p style="color:var(--text-muted); font-size:0.8rem; letter-spacing:1px;" id="dp-coord-label">
            LAT: 0.0000 | LON: 0.0000
        </p>
    </div>

    <button type="button" class="btn btn-primary" id="btn-goto-report" style="margin-bottom:2rem; width:100%;">
        LOG VISIT
    </button>

    <div id="dp-reroll-container" class="reroll-container d-none">
        <button type="button" class="btn btn-warning reroll-btn" id="btn-reroll-dp">
            🎲 REROLL DASHPOINT
        </button>

        <div id="dp-reroll-form" class="d-none" style="margin-top:0.5rem; background:rgba(255, 255, 255, 0.03); padding:1rem; border-radius:4px; border:1px solid rgba(255, 183, 3, 0.15);">
            <div style="font-size:0.8rem; font-weight:bold; margin-bottom:0.5rem; color:var(--text-main);">ENTER REROLL REASON</div>
            <input type="text" id="reroll-reason-input" class="data-input" placeholder="e.g., Private property, safety issue..." maxlength="99" style="width:100%; margin-bottom:0.75rem;">
            <div style="display:flex; gap:0.5rem;">
                <button type="button" class="btn btn-warning" id="btn-confirm-reroll" style="flex:1; padding:0.5rem 1rem; font-size:0.8rem;">CONFIRM</button>
                <button type="button" class="btn btn-secondary" id="btn-cancel-reroll" style="flex:1; padding:0.5rem 1rem; font-size:0.8rem;">CANCEL</button>
            </div>
        </div>

        <div id="dp-reroll-quota" class="reroll-quota-badge"></div>
        <div id="dp-reroll-notice" class="reroll-notice-badge d-none">
            This dashpoint was rerolled during preview.
        </div>
    </div>


    <div class="dash-block" style="border-top:1px dashed var(--text-muted); padding-top:1.5rem;">
        <label>PREVIOUS VISITS</label>

        <div id="dp-visits-container" style="margin-top:1rem; font-size:0.85rem;">
            <p style="color:var(--text-muted); text-align:center;">Loading visits...</p>
        </div>
    </div>
</div>
