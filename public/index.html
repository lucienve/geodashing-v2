<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Mobile viewport settings to prevent layout zooming when tapping inputs -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO Pipeline Basics -->
    <title>Geodashing V2 | The Global GPS Challenge</title>
    <meta name="description"
        content="A fun location-based scavenger hunt using randomized global dashpoints to explore the world.">

    <!-- Branding -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Google Fonts: Inter for readability, Roboto Mono for data displays -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- Core Glassmorphism Design System -->
    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <!-- Layer 0: The persistent Google Map. 
         This map stays cached in memory
         as the player navigates through the site. -->
    <div id="map-wrapper">
        <div id="map"></div>
    </div>

    <!-- Layer 1: The Glassmorphism UI Shell overlaying the Map completely -->
    <div id="ui-shell">

        <!-- Top Navigation -->
        <nav id="top-nav" class="glass-panel">
            <h1 class="logo glow-text" style="display:inline-flex; align-items:center;">
                <a href="#home" style="text-decoration:none; color:inherit; display:inline-flex; align-items:center;">GEODASHING<span class="version-tag">.v2</span></a>
                <select id="game-selector" title="Select Game Context"
                    style="margin-left:1rem; font-size:1.1rem; border:none; border-bottom:1px dashed var(--accent-amber); background:transparent; color:var(--accent-amber); appearance: none; outline: none; cursor:pointer; font-family:var(--font-mono); font-weight:600; padding-bottom:2px;">
                    <option value="">[ Loading ... ]</option>
                </select>
            </h1>

            <div id="desktop-links" class="nav-links">
                <!-- Standard navigation links are dynamically generated in app.js via the APP_NAVIGATION array -->
                <a href="#login" id="nav-auth-btn" class="nav-link highlight">Player login</a>
            </div>

            <!-- Mobile Hamburger Toggle -->
            <button id="mobile-menu-btn" class="btn btn-outline glow-box">☰</button>
        </nav>

        <!-- Mobile Navigation Drawer -->
        <div id="mobile-nav-drawer" class="glass-panel">
            <button id="mobile-close-btn" class="btn btn-outline glow-box">&times;</button>
            <div class="mobile-nav-links">
                <!-- Standard navigation links are dynamically generated in app.js via the APP_NAVIGATION array -->
                <a href="#login" id="mobile-nav-auth-btn" class="nav-link highlight">Player login</a>
            </div>
        </div>

        <!-- Mobile Navigation Backdrop -->
        <div id="mobile-nav-backdrop"></div>

        <!-- Layer 2: The Router Content Injector.
             When the URL hash changes (e.g., `#report`), app.js dynamically fetches 
             the template and places the HTML into this container. -->
        <main id="app-content"></main>

    </div>

    <!-- Cookie Consent Banner -->
    <div id="cookie-consent-banner" class="d-none cookie-banner">
        <div class="cookie-text">
            We use minimal analytics to improve your Geodashing experience. Accept diagnostic cookies?
        </div>
        <div class="cookie-buttons">
            <button id="btn-accept-cookies" class="btn btn-outline btn-accept">ACCEPT</button>
            <button id="btn-deny-cookies" class="btn btn-outline btn-deny">DENY</button>
        </div>
    </div>

    <!-- Core Javascript (Load order matters here) -->
    <script src="js/analytics.js"></script>
    <script src="js/api.js"></script>
    <script src="js/controllers.js"></script>
    <script src="js/app.js"></script>
    <script src="js/map.js"></script>

    <!-- Google Marker Clusterer -->
    <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>

    <!-- Google Maps JS API -->
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBDJBkvgGtuwxwadQc4-T13K5Ifg_HcFDg&callback=initMap&loading=async&libraries=marker"></script>
</body>

</html>
