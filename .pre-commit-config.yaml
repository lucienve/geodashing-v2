repos:
  - repo: local
    hooks:
      - id: yapf
        name: YAPF
        entry: uv run yapf --diff --recursive backend/
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
        stages: [pre-commit]

      - id: pylint
        name: PyLint
        entry: uv run pylint backend/
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
        stages: [pre-push]

      - id: mypy
        name: Mypy
        entry: uv run mypy backend/
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
        stages: [pre-push]

      - id: pyright
        name: Pyright
        entry: uv run pyright backend/
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
        stages: [pre-push]

      - id: pytest
        name: Pytest
        entry: uv run pytest -n auto backend/
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
        stages: [pre-push]

      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        pass_filenames: false
        files: ^(public/js/.*\.js|e2e/.*\.js|.*\.m?js)$
        stages: [pre-commit]

      - id: prettier
        name: Prettier
        entry: npm run format:check
        language: system
        pass_filenames: false
        files: \.(md|m?js)$
        stages: [pre-commit]

      - id: markdownlint
        name: Markdownlint
        entry: npm run lint:md
        language: system
        pass_filenames: false
        files: \.md$
        stages: [pre-commit]

      - id: phpcs
        name: PHP CodeSniffer
        entry: composer run lint
        language: system
        pass_filenames: false
        files: ^(backend|public/api|e2e)/.*\.php$
        stages: [pre-commit]

      - id: phpunit
        name: PHPUnit
        entry: composer run test
        language: system
        pass_filenames: false
        files: ^(backend|public/api|e2e)/.*\.php$
        stages: [pre-push]
