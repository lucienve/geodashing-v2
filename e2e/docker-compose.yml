
services:
  # Natively initializes the mock Playwright database matching the CI
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: default_root_pass
      MYSQL_DATABASE: geodashing_test
      MYSQL_USER: geodashing_test
      MYSQL_PASSWORD: geodashing_test_secure_pass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Natively mocks the Google Cloud Storage backend API
  fake-gcs-server:
    image: fsouza/fake-gcs-server
    restart: unless-stopped
    ports:
      - "4443:4443"
    volumes:
      - ./gcs-data:/data
    command: >-
      -scheme http
      -public-host localhost:4443
      -data /data
