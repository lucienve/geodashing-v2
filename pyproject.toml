[project]
name = "geodashing-v2"
version = "0.1.0"
description = "Geodashing V2 - The Global GPS Challenge"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.1.4",
    "google-auth>=2.38.0",
    "google-genai>=2.19.0",
    "mysql-connector-python>=26.7.0",
    "numpy>=2.5.2",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pydantic>=2.11.0",
    "pylint>=4.0.7",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "yapf>=0.43.0",
]

[tool.uv]
default-groups = ["dev"]
