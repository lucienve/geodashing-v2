<div class="template-view" id="view-dashboard">
    <h2>STATUS.SYS</h2>
    
    <div class="dash-block">
        <label>ACTIVE MISSION CYCLE:</label>
        <p class="data-input" id="dash-game-id" style="text-align:center; font-size:1.5rem;">[ OFFLINE ]</p>
    </div>

    <div class="dash-block" style="margin-top: 1.5rem;">
        <label>T-MINUS END_GAME:</label>
        <div id="countdown-timer" style="border:1px solid var(--accent-red); padding:1rem; border-radius:4px; text-align:center;">
            <span style="color:var(--accent-amber); font-size:2.5rem; letter-spacing:3px; text-shadow:0 0 10px rgba(245, 158, 11, 0.5);" id="timer-display">
                00:00:00:00
            </span>
        </div>
        <small style="color:var(--text-muted); display:block; text-align:center; margin-top:0.5rem;">DAYS : HRS : MIN : SEC</small>
    </div>

    <!-- We will inject live ticker updates heavily in Phase 5 depending on the API logs -->
    <div class="dash-block" style="margin-top: 2rem;">
        <label>GAME LOG</label>
        <div class="data-input" id="live-ticker" style="height:150px; overflow-y:auto; font-size:0.8rem; line-height:1.5;">
            > SYSTEM BOOT_SEQ COMPLETE.<br>
            > AWAITING DATABASE LINK...
        </div>
    </div>
</div>
