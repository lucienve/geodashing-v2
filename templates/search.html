<div class="template-view" id="view-search">
    <h2>REGION SCANNER</h2>
    <p style="margin-bottom:1.5rem; font-size:0.85rem; color:var(--text-muted); line-height:1.4;">
        Manually dial the bounding box parameters to force the map view, or download regional XML vectors directly to your Garmin GPS array locally without internet.
    </p>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem; margin-bottom:1.5rem;">
        <div>
            <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:0.25rem; display:block;">NORTH BOUND</label>
            <input type="number" step="any" id="search-n" class="data-input" placeholder="42.500" style="margin-bottom:0;">
        </div>
        <div>
            <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:0.25rem; display:block;">SOUTH BOUND</label>
            <input type="number" step="any" id="search-s" class="data-input" placeholder="41.500" style="margin-bottom:0;">
        </div>
        <div>
            <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:0.25rem; display:block;">EAST BOUND</label>
            <input type="number" step="any" id="search-e" class="data-input" placeholder="-70.000" style="margin-bottom:0;">
        </div>
        <div>
            <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:0.25rem; display:block;">WEST BOUND</label>
            <input type="number" step="any" id="search-w" class="data-input" placeholder="-72.000" style="margin-bottom:0;">
        </div>
    </div>

    <!-- Quick Map Teleporter button (will hook via JS controllers) -->
    <button type="button" class="btn btn-secondary" id="btn-teleport" style="margin-bottom:1.5rem;">
        [ SNAP MAP TO BOUNDS ]
    </button>

    <div class="dash-block" style="border-top:1px dashed var(--accent-amber-glow); padding-top:1.5rem;">
        <h3 style="color:var(--accent-amber); font-size:1rem; margin-bottom:1rem;">EXTERNAL EXPORT PROTOCOLS</h3>
        
        <div style="display:flex; gap:1rem;">
            <!-- These are purely decoupled DOM triggers mapping to Phase 3.5 Native Exporters! -->
            <button type="button" class="btn btn-primary" id="btn-export-gpx" style="flex:1;">
                DOWNLINK .GPX
            </button>
            <button type="button" class="btn btn-primary" id="btn-export-loc" style="flex:1; background:var(--accent-green); color:#000; box-shadow:0 0 10px rgba(16, 185, 129, 0.4);">
                DOWNLINK .LOC
            </button>
        </div>
        <small style="display:block; margin-top:0.75rem; color:#666; font-size:0.7rem; text-align:center;">
            *Downloads map precisely to the coordinates strictly entered in the fields above.
        </small>
    </div>
</div>
