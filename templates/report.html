<div class="template-view" id="view-report">
    <a href="#home" class="close-btn" aria-label="Close View">&times;</a>
    <h2>LOG A VISIT</h2>
    
    <div id="report-feedback"></div>

    <form id="form-report" enctype="multipart/form-data">
        <div class="form-group" style="text-align:center; padding-bottom: 1.5rem; margin-bottom: 1.5rem; border-bottom: 1px dashed var(--accent-amber-glow);">
            <label style="color:var(--text-muted); letter-spacing: 2px; font-size: 0.75rem;">DASHPOINT</label>
            <!-- Functionally an input for the POST request, visually an immutable Header! -->
            <input type="text" 
                   id="dashpoint_id" 
                   name="dashpoint_id" 
                   placeholder="GD01-UNKNOWN"
                   style="background:transparent; border:none; color:var(--accent-amber); font-size:2rem; font-weight:700; font-family:var(--font-mono); text-align:center; width:100%; pointer-events:none; outline:none; margin-top:0.5rem;" 
                   readonly>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:0.4rem;">
             <label style="color:var(--text-muted); font-size:0.85rem; padding-bottom:0; margin-bottom:0;">VISIT COORDINATES [REQUIRED]</label>
             <button type="button" class="btn btn-secondary" id="btn-geolocation" style="padding:0.3rem 0.6rem; font-size:0.7rem; width:auto; border-color:var(--accent-green); color:var(--accent-green); margin-bottom:0; line-height:1;">
                 [ SYNC LIVE GPS ]
             </button>
        </div>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem; margin-bottom:1.25rem;">
            <div class="form-group" style="margin-bottom:0;">
                <!-- Specifically ensuring readonly is entirely removed mathematically authorizing overrides -->
                <input type="text" 
                       inputmode="decimal"
                       id="input-lat" 
                       name="lat" 
                       class="data-input" 
                       placeholder="Lat: 42.1234" 
                       oninput="this.value = this.value.replace(/[^0-9.\-]/g, '');"
                       required>
            </div>
            
            <div class="form-group" style="margin-bottom:0;">
                <!-- Explicit manual overriding enabled for physical GPS logging loops -->
                <input type="text" 
                       inputmode="decimal"
                       id="input-lon" 
                       name="lon" 
                       class="data-input" 
                       placeholder="Lon: -71.1234" 
                       oninput="this.value = this.value.replace(/[^0-9.\-]/g, '');"
                       required>
            </div>
        </div>

        <div class="form-group">
            <label>Visit photos [OPTIONAL]</label>
            <small style="color:var(--accent-amber); display:block; margin-bottom:0.5rem; font-size:0.75rem;">Limit 10 Photos</small>
            <input type="file" 
                   name="photos[]" 
                   accept="image/*" 
                   capture="environment" 
                   class="data-input" 
                   style="font-size:0.8rem;"
                   multiple>
        </div>

        <div class="form-group">
            <label>Log [OPTIONAL]</label>
            <textarea name="notes" class="data-input" rows="3" placeholder="Terrain anomalies, unexpected wildlife..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit-report">
            SUBMIT LOG
        </button>
    </form>
</div>
