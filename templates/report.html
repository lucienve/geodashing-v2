<div class="template-view" id="view-report">
    <a href="#home" class="close-btn" aria-label="Close View">&times;</a>
    <h2>LOG A VISIT</h2>

    <div id="report-feedback"></div>

    <form id="form-report" enctype="multipart/form-data">
        <div class="form-group dashpoint-header">
            <label class="dashpoint-label">DASHPOINT</label>
            <!-- Hidden input for the POST request, displayed as a header -->
            <input type="text" id="dashpoint_id" name="dashpoint_id" placeholder="GD001-XXXX" class="dashpoint-id-badge" readonly>
        </div>

        <div class="form-group-flex">
            <label class="form-group-flex-label">VISIT COORDINATES [REQUIRED]</label>
            <button type="button" class="btn btn-secondary btn-sync-gps" id="btn-geolocation">
                SYNC LIVE GPS
            </button>
        </div>

        <div class="grid-2-col">
            <div class="form-group mb-0">
                <!-- Latitude input -->
                <input type="text" inputmode="decimal" id="input-lat" name="lat" class="data-input" placeholder="Lat: 42.1234" required>
            </div>

            <div class="form-group mb-0">
                <!-- Longitude input -->
                <input type="text" inputmode="decimal" id="input-lon" name="lon" class="data-input" placeholder="Lon: -71.1234" required>
            </div>
        </div>

        <div class="form-group">
            <label>Visit photos [OPTIONAL]</label>
            <small class="photo-limit-text">Limit 10 Photos</small>

            <input type="file" id="input-photos" name="photos[]" accept="image/*" multiple style="display: none;">

            <button type="button" class="btn btn-secondary btn-add-photos" id="btn-add-photos">
                ADD PHOTOS
            </button>
            <div id="photo-preview-grid" class="photo-preview-grid">
            </div>
        </div>

        <div class="form-group">
            <label class="log-label">Log [REQUIRED]</label>
            <textarea id="log-textarea" name="notes" class="data-input log-textarea" rows="8" maxlength="10000" placeholder="Tell us about your visit! What did you see?" required></textarea>
            <div id="char-counter" class="char-counter">10,000 chars remaining</div>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit-report">
            SUBMIT LOG
        </button>
    </form>
</div>
