name: Type Check

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**/*.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'mypy.ini'
      - 'pyrightconfig.json'
      - '.github/workflows/typecheck.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**/*.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'mypy.ini'
      - 'pyrightconfig.json'
      - '.github/workflows/typecheck.yml'
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m venv .venv
        .venv/bin/pip install --upgrade pip
        if [ -f requirements-dev.txt ]; then .venv/bin/pip install -r requirements-dev.txt; fi

    - name: Run mypy
      run: |
        .venv/bin/mypy backend/

    - name: Run pyright
      run: |
        .venv/bin/pyright backend/