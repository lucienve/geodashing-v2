name: Automated tests

on:
  workflow_dispatch:

jobs:
  php-tests:
    name: PHP Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit backend/tests/

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: PYTHONPATH=. pytest backend/tests/

  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: default_root_pass
          MYSQL_DATABASE: geodashing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP (for native development server)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure Backend Environment
        run: |
          cat << 'EOF' > backend/config.ini
          DB_HOST = 127.0.0.1
          DB_PORT = 3306
          DB_NAME = geodashing
          DB_USER = root
          DB_PASS = default_root_pass
          EOF

      - name: Initialize Database Schema & Inject Dummy Data
        run: |
          # 1. Load the physical tables
          mysql -h 127.0.0.1 -u root -pdefault_root_pass geodashing < schema.sql
          
          # 2. Inject one live game context explicitly to ensure the Playwright Layouts 
          # that bind to historical data or current state don't hit 404s/empty states.
          mysql -h 127.0.0.1 -u root -pdefault_root_pass geodashing -e "
            INSERT INTO games (id, title, start_time, end_time, is_active) 
            VALUES (1, 'CI Test Game', DATE_SUB(NOW(), INTERVAL 1 DAY), DATE_ADD(NOW(), INTERVAL 30 DAY), TRUE);
          "

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
