name: E2E Playwright Tests

permissions:
  contents: read

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'js/**'
      - 'css/**'
      - 'e2e/**'
      - 'backend/**/*.php'
      - 'templates/**'
      - 'index.html'
      - 'package.json'
      - 'playwright.config.js'
      - 'schema.sql'
      - '.github/workflows/ci-e2e.yml'
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'js/**'
      - 'css/**'
      - 'e2e/**'
      - 'backend/**/*.php'
      - 'templates/**'
      - 'index.html'
      - 'package.json'
      - 'playwright.config.js'
      - 'schema.sql'
      - '.github/workflows/ci-e2e.yml'
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start Services (MySQL, GCS Emulator, Web Server)
        run: |
          docker compose -f e2e/docker-compose.yml up --build -d

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install PHP Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Configure Backend Environment
        run: |
          cat << 'EOF' > backend/config.ini
          DB_HOST = 127.0.0.1
          DB_PORT = 3306
          DB_NAME = geodashing
          DB_USER = root
          DB_PASS = default_root_pass
          EOF

      - name: Initialize Database Schema & Inject Dummy Data
        run: |
          bash ./e2e/setup-test-db.sh
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: default_root_pass
          DB_NAME: geodashing_test

      - name: Install Node Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: default_root_pass
          DB_NAME: geodashing_test
          GCS_EMULATOR_HOST: http://127.0.0.1:4443

      - name: Upload Playwright Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
