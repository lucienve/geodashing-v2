name: E2E Playwright Tests

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'js/**'
      - 'css/**'
      - 'e2e/**'
      - 'backend/**/*.php'
      - 'templates/**'
      - 'index.html'
      - 'package.json'
      - 'playwright.config.js'
      - 'schema.sql'
      - '.github/workflows/ci-e2e.yml'
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'js/**'
      - 'css/**'
      - 'e2e/**'
      - 'backend/**/*.php'
      - 'templates/**'
      - 'index.html'
      - 'package.json'
      - 'playwright.config.js'
      - 'schema.sql'
      - '.github/workflows/ci-e2e.yml'
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: default_root_pass
          MYSQL_DATABASE: geodashing_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP (for native development server)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Configure Backend Environment
        run: |
          cat << 'EOF' > backend/config.ini
          DB_HOST = 127.0.0.1
          DB_PORT = 3306
          DB_NAME = geodashing
          DB_USER = root
          DB_PASS = default_root_pass
          EOF

      - name: Initialize Database Schema & Inject Dummy Data
        run: |
          ./e2e/setup-test-db.sh
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: default_root_pass
          DB_NAME: geodashing_test

      - name: Install Node Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: default_root_pass
          DB_NAME: geodashing_test

      - name: Upload Playwright Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
