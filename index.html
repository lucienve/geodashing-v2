<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Enforce STRICT mobile viewport mapping preventing layout zooming when tapping inputs -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO Pipeline Basics -->
    <title>Geodashing V2 | The Global GPS Challenge</title>
    <meta name="description"
        content="A premium location-based scavenger hunt utilizing randomized global dashpoints and competitive live networking.">

    <!-- Branding -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Google Fonts: Inter for readability, Roboto Mono to satisfy the early-2000s Utilitarian Dashboard request natively -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- Core Glassmorphism Design System -->
    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <!-- Layer 0: The Persistent Google Map. 
         This DIV physically never unloads. It stays cached in memory identically
         as the player navigates HTML templates via the router. -->
    <div id="map-wrapper">
        <div id="map"></div>
    </div>

    <!-- Layer 1: The Glassmorphism UI Shell overlaying the Map completely -->
    <div id="ui-shell">

        <!-- Persistent Top Navigation Console -->
        <nav id="top-nav" class="glass-panel">
            <h1 class="logo glow-text">
                GEODASHING<span class="version-tag">.v2</span>
                <span id="header-game-id"
                    style="color:var(--accent-green); font-size:0.8rem; margin-left:15px; letter-spacing:1px;"></span>
            </h1>

            <div id="desktop-links" class="nav-links">
                <a href="#home" class="nav-link active">MAP</a>
                <a href="#leaderboard" class="nav-link">LEADERBOARD</a>
                <!-- Pure CSS Help Dropdown Native Component -->
                <div class="dropdown">
                    <a href="#" class="nav-link">HELP ▾</a>
                    <div class="dropdown-content">
                        <a href="#about" class="nav-link">About</a>
                        <a href="#how-to" class="nav-link">How to Play</a>
                        <a href="#contact" class="nav-link">Contact</a>
                        <a href="#search" class="nav-link">Export Game Data</a>
                    </div>
                </div>
                <a href="#login" id="nav-auth-btn" class="nav-link highlight">Player login</a>
            </div>

            <!-- Mobile Hamburger Toggle -->
            <button id="mobile-menu-btn" class="btn btn-outline glow-box">☰</button>
        </nav>

        <!-- Global Email Verification Warning -->
        <div id="verify-banner" class="d-none" style="background:var(--accent-amber); color:#000; text-align:center; padding:12px; font-weight:bold; cursor:pointer; font-size:0.9rem; border-bottom:2px solid #000; transition:all 0.3s ease;">
            [ ACTION REQUIRED: ACCOUNT UNVERIFIED - CHECK EMAIL OR CLICK HERE TO RESEND ]
        </div>

        <!-- Layer 2: The Router Content Injector.
             When the URL hash changes (e.g., `#report`), app.js dynamically fetches 
             the /templates/report.html payload and blasts the HTML perfectly into this container. -->
        <main id="app-content"></main>

    </div>

    <!-- Floating Action Button (FAB) permanently pinned to bottom right.
         Dynamically hidden/revealed natively by app.js based on auth state. -->
    <a href="#report" id="fab-report" class="fab glow-box-amber d-none">
        <span class="fab-icon">📍</span>
        <span class="fab-text">LOG VISIT</span>
    </a>

    <!-- Core Javascript Engine (Load order matters here) -->
    <script src="js/api.js"></script>
    <script src="js/controllers.js"></script>
    <script src="js/app.js"></script>
    <script src="js/map.js"></script>

    <!-- Google Maps JS API Engine natively rendering the bounds asynchronously -->
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBDJBkvgGtuwxwadQc4-T13K5Ifg_HcFDg&callback=initMap&loading=async&libraries=marker"></script>
</body>

</html>
