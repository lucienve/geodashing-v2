<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Mobile viewport settings to prevent layout zooming when tapping inputs -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO Pipeline Basics -->
    <title>Geodashing V2 | The Global GPS Challenge</title>
    <meta name="description"
        content="A fun location-based scavenger hunt using randomized global dashpoints to explore the world.">

    <!-- Branding -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Google Fonts: Inter for readability, Roboto Mono for data displays -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- Core Glassmorphism Design System -->
    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <!-- Layer 0: The persistent Google Map. 
         This map stays cached in memory
         as the player navigates through the site. -->
    <div id="map-wrapper">
        <div id="map"></div>
    </div>

    <!-- Layer 1: The Glassmorphism UI Shell overlaying the Map completely -->
    <div id="ui-shell">

        <!-- Top Navigation -->
        <nav id="top-nav" class="glass-panel">
            <h1 class="logo glow-text">
                GEODASHING<span class="version-tag">.v2</span>
                <span id="header-game-id"
                    style="color:var(--accent-green); font-size:0.8rem; margin-left:15px; letter-spacing:1px;"></span>
            </h1>

            <div id="desktop-links" class="nav-links">
                <a href="#home" class="nav-link active">MAP</a>
                <a href="#leaderboard" class="nav-link">LEADERBOARD</a>
                <!-- Pure CSS Help Dropdown Native Component -->
                <div class="dropdown">
                    <a href="#" class="nav-link">HELP ▾</a>
                    <div class="dropdown-content">
                        <a href="#about" class="nav-link">About</a>
                        <a href="#how-to" class="nav-link">How to Play</a>
                        <a href="#contact" class="nav-link">Contact</a>
                        <a href="#search" class="nav-link">Export Game Data</a>
                    </div>
                </div>
                <a href="#login" id="nav-auth-btn" class="nav-link highlight">Player login</a>
            </div>

            <!-- Mobile Hamburger Toggle -->
            <button id="mobile-menu-btn" class="btn btn-outline glow-box">☰</button>
        </nav>

        <!-- Layer 2: The Router Content Injector.
             When the URL hash changes (e.g., `#report`), app.js dynamically fetches 
             the template and places the HTML into this container. -->
        <main id="app-content"></main>

    </div>

    <!-- Floating Action Button (FAB) pinned to bottom right.
         Hidden/revealed by app.js based on auth state. -->
    <a href="#report" id="fab-report" class="fab glow-box-amber d-none">
        <span class="fab-icon">📍</span>
        <span class="fab-text">LOG VISIT</span>
    </a>

    <!-- Cookie Consent Banner -->
    <div id="cookie-consent-banner" class="d-none"
        style="position:fixed; bottom:0; left:0; right:0; background:var(--bg-panel); border-top:1px solid var(--accent-amber); padding:1rem; z-index:9999; display:flex; justify-content:space-between; align-items:center;">
        <div style="font-size:0.9rem; color:var(--text-main); font-family:var(--font-mono);">
            We use Google Analytics to learn how players find and use the site, and to improve the Geodashing
            experience. Do you accept diagnostic cookies?
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="window.acceptCookies()" class="btn btn-outline"
                style="border-color:var(--accent-green); color:var(--accent-green);">ACCEPT</button>
            <button onclick="window.denyCookies()" class="btn btn-outline"
                style="border-color:var(--accent-red); color:var(--accent-red);">DENY</button>
        </div>
    </div>

    <!-- Core Javascript (Load order matters here) -->
    <script src="js/analytics.js"></script>
    <script src="js/api.js"></script>
    <script src="js/controllers.js"></script>
    <script src="js/app.js"></script>
    <script src="js/map.js"></script>

    <!-- Google Maps JS API -->
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBDJBkvgGtuwxwadQc4-T13K5Ifg_HcFDg&callback=initMap&loading=async&libraries=marker"></script>
</body>

</html>
